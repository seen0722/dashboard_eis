# plan（人力分攤-updated）裡不是專案的列。
# ⚠ 每一項都註明「它其實是什麼」——排除不等於不理解。
#    初版把列 130 當成「編制上限」，得出「編制已貼滿」的錯誤旗艦結論。

# 1. 分攤單位欄若為此值，該列是小計/檢核，不是專案
non_project_units:
  - '人力編列 BU RD+PM'   # = SUM(BU RD + BU PM)，B 欄的「專案名」在 -PM 版是 218、-updated 版是 219

# 2. 這些「專案名」其實是產品別小計列
product_subtotals:
  - DIOR          # 222.5 = 該產品別各專案加總
  - UNICORN       # 23.8
  - TRENTON       # 13.5
  - New Segment   # 8.8
  - BD            # 2.4
  - DMS           # 1.5
  - Others

# 3. 報價階段，本就不編 plan（需求方確認 2026-07-15）→ 獨立分類，不算異常
rfq_pattern: '^(bu10_rfq|tr_bu10_)'

# 4. 製造（產線）：本專案 review 的是研發人力執行，產線不在範圍
#    202606 共 6,603.91 FTE（430 個部門，PMX／名碩／墨西哥廠）
exclude_dept_prefix:
  - H

# --- 編制檢核區塊（列 122~131）的正確讀法，供參考，勿當專案 ---
# 列 129  BU RD+ PM 人力     = 203（硬編，12 個月全同）  ← 這才是編制
# 列 130  人力編列 BU RD+PM  = SUM(列126:列127)          ← plan 自己的 BU RD+BU PM
# 列 131  不足/超出人力       = 列129 - 列130             ← 真訊號：6月 -2.75、10月 -25.35
