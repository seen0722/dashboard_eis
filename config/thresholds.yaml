# 指標門檻。由需求方依實務調整。

over_allocation:
  # 超配清單的下限（絕對 FTE）。低於此值不列入——避免 plan 只有 0.5 的專案
  # 因為 +0.2 就顯示成 140% 而佔據版面。
  min_excess_fte: 0.5

  # 分母過小警告：plan 低於此值時，百分比不具意義，UI 應淡化百分比
  small_denominator_fte: 2.0

display:
  # 排序依據：absolute（絕對超出量）或 percent。一律用 absolute——
  # 按 % 排會把 AON100(413%, 超出 1.41) 排在 THORPE(159%, 超出 6.25) 前面。
  sort_by: absolute

  # 單位下鑽時每個專案顯示幾個部門
  top_depts: 8

# 標記自己的部門（報告自曝用）
own_departments:
  - BA80700R01   # 第十事業處-研發二處-研發三部
  - BA80710R01   # 研發三部-研發一課
  - BA80720R01   # 研發三部-研發二課

# 碎片化（部門檢視 review_dept）
# focus = Σ(share²)，越低越碎。⚠ 實測：單一門檻會誤報 —— BSP 深度職能 focus<0.7 就是警訊，
#         PM/QTC 廣度職能 focus 0.2 是常態。故按職能分級（見設計 §5.3）。
fragmentation:
  # 廣度職能：天生跨案，門檻放寬。EIS_FUNCTION 屬這些的人，focus 低不標記
  wide_functions: [PM, "ME PM", "RD PM", RDPM, "RE PM", "NPI PM", "SYSTEM PM",
                   "Sales PM", QTC, SQA, "ME Test", NPI, "NPI MC"]
  # 深度職能的碎片門檻（focus 低於此且專案數 ≥ min_projects 才標記）
  deep_focus_max: 0.7
  # 廣度職能的碎片門檻（更寬鬆；低於此才值得一看）
  wide_focus_max: 0.3
  min_projects: 3
  # 微量支援不計入「專案數」的門檻：< 此 FTE 的專案視為打雜，不算切換成本
  #   例：0.93/0.07 兩案，0.07 是打雜 → 實質專責，不該標碎片
  trivial_share_fte: 0.1

# ---- BU10 Portfolio Review（src/portfolio）----
portfolio:
  mp_slip_days: 60            # MP 較 Original MP 延後超過此天數 → 健康度 track（2026-10-01 起不列為例外）
  mp_typo_days: 300           # 相差超過此天數 → 疑為輸入錯誤
  spare_capacity_pct: 85      # 部門負載低於此 % → 可調度
  suspended_fte_min: 0.05     # 停案仍掛人力的門檻
  briefing_stale_days: 60     # 資料更新日距快照超過此天數 → 過舊
  upcoming_weeks: 8           # 未來里程碑視窗
  timeline_months: 6          # 時程表視窗
